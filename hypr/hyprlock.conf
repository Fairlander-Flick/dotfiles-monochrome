# Background
background {
    monitor = 
    path = /home/$USER/Wallpapers/black.jpg
    blur_passes = 2
    blur_size = 4
    contrast = 0.85
    brightness = 0.75
    vibrancy = 0.08
    vibrancy_darkness = 0.0
}

# General
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# Time
label {
    monitor = 
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(255, 255, 255, 0.8)
    font_size = 120
    font_family = SF Pro Display Bold
    position = 0, 320
    halign = center
    valign = center
}

# Date
label {
    monitor = 
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.6)
    font_size = 24
    font_family = SF Pro Text
    position = 0, 200
    halign = center
    valign = center
}

# Profile Photo
image {
    monitor = 
    path = /home/$USER/.config/hypr/hyprlock/user.png
    border_color = rgba(255, 255, 255, 0.2)
    border_size = 2
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -150
    halign = center
    valign = center
}

# User Gretting
label {
    monitor = 
    text = $USER
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    font_family = SF Pro Text
    position = 0, -230
    halign = center
    valign = center
}

# Input Field
input-field {
    monitor = 
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgba(255, 255, 255, 0.9)
    check_color = rgba(255, 255, 255, 0.5)
    fail_color = rgba(255, 0, 0, 0.5)
    fade_on_empty = true
    font_family = SF Pro Text
    placeholder_text = <span foreground="##ffffff44">Enter Password...</span>
    hide_input = false
    rounding = 8
    position = 0, -300
    halign = center
    valign = center
}
