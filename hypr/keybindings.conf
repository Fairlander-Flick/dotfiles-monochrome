$mainMod = SUPER # Sets "Windows" key as main modifier

# Basic Applications
bind = $mainMod, N, exec, networkmanager_dmenu
bind = $mainMod, A, exec, bash ~/.scripts/toggle-waybar-gaps.sh
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, D, exec, $powermenu
bind = $mainMod SHIFT, W, exec, $wallpaper
# Screenshot Bindings
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy # Selection to Clipboard
bind = ALT, Print, exec, grim -g "$(slurp)" ~/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send "📸 Screenshot" "Area saved to ~/Screenshots" # Selection to folder

bind = $mainMod SHIFT, backslash, exec, hyprlock
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, exec, code
bind = $mainMod, T, exec, kitty
bind = $mainMod, Return, exec, kitty
bind = $mainMod SHIFT, V, togglefloating,

# System Controls (ThinkPad X1 Yoga Friendly)
# Volume
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness (Laptop Screen)
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Backwards compatibility for F-keys if Fn-lock is on
bind = , F10, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , F12, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , F8, exec, brightnessctl set 5%-
binde = , F9, exec, brightnessctl set 5%+

# Media Controls
bind = $mainMod SHIFT, period, exec, playerctl next
bind = $mainMod SHIFT, comma, exec, playerctl previous
bind = $mainMod SHIFT, space, exec, playerctl play-pause

# Vim-like Focus (h, j, k, l)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Vim-like Window Movement (Shift + h, j, k, l)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Arrow Key Focus/Movement
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = $mainMod, B, layoutmsg, togglesplit

# Workspaces (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Window Rules
# windowrule = float, tertime #
# windowrule = size 344 144, tertime #
# windowrule = move 10 10, tertime #

# Mouse Bindings
bindm = $mainMod, mouse:272, movewindow # [cite: 3]
bindm = $mainMod, mouse:273, resizewindow

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
